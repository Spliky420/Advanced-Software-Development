<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Research Library</h1>
    <button id="new-doc-btn" class="btn btn-primary">+ New document</button>
  </header>

  <main class="layout">
    <section class="library-pane">
      <form id="filter-form" class="filters">
        <input type="search" id="filter-q" placeholder="Search title or source…" />
        <select id="filter-doc-type">
          <option value="">All types</option>
        </select>
        <input type="text" id="filter-date-range" class="date-range-input"
          placeholder="Published date range" readonly />
        <button type="submit" class="btn btn-icon" aria-label="Search" title="Search">🔍</button>
        <button type="button" id="clear-filters-btn" class="btn btn-ghost">Clear</button>
      </form>

      <div id="status-banner" class="banner" hidden></div>

      <div id="document-grid" class="grid" aria-live="polite"></div>
    </section>

    <aside class="side-pane">
      <section id="detail-pane" class="detail-pane" hidden>
        <button id="close-detail-btn" class="btn btn-ghost close-btn">✕ Close</button>
        <div id="detail-content"></div>
      </section>

      <section class="rag-module">
        <h3>🔎 Retrieval search</h3>
        <p class="muted">
          Searches indexed chunks across every document by meaning, not just
          keyword match — the same endpoint other services call to pull
          context for their own features.
        </p>
        <form id="rag-form" class="rag-form">
          <input type="text" id="rag-query" placeholder="e.g. how does the RBA set interest rates?" required />
          <button type="submit" class="btn">Search</button>
        </form>
        <div id="rag-results"></div>
      </section>
    </aside>
  </main>

  <dialog id="doc-modal">
    <form id="doc-form" method="dialog">
      <h2 id="doc-modal-title">New document</h2>

      <label>
        Title
        <input type="text" id="field-title" required maxlength="300" />
      </label>

      <label>
        Source
        <input type="text" id="field-source" maxlength="200" placeholder="e.g. Investopedia" />
      </label>

      <div class="field-row">
        <label>
          Type
          <select id="field-doc-type" required></select>
        </label>
        <label>
          Published on
          <input type="date" id="field-published-on" />
        </label>
      </div>

      <label>
        Document
        <div class="body-source-row">
          <input type="file" id="field-body-file" accept=".txt,.md,.csv,.json,.pdf,text/plain,application/pdf" />
          <span class="muted">or paste/type below</span>
        </div>
      </label>
      <p id="file-error" class="form-errors" hidden></p>

      <label>
        Body text
        <textarea id="field-body-text" required rows="10"
          placeholder="Paste or type the full document text here…"></textarea>
      </label>

      <p id="form-errors" class="form-errors" hidden></p>

      <div class="modal-actions">
        <button type="button" id="cancel-doc-btn" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-doc-btn">Save</button>
      </div>
    </form>
  </dialog>

  <!-- PDF text extraction for the "upload a file" path in the document form.
       Client-side only: the backend never sees a PDF, only the extracted
       body_text string, so no server-side change or dependency is needed. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
