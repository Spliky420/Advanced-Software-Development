server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy the API through the same origin so the page needs no CORS headers
    # on the Flask side. enerel-backend resolves on the compose network.
    location /api/ {
        proxy_pass http://enerel-backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Generous, to allow for slow local LLM generation on /summarize and
        # /search -- a map-reduce summary can make several sequential calls.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://enerel-backend:5000/health;
        proxy_set_header Host $host;
    }
}
