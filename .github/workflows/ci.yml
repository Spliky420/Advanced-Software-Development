name: CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./Maxwell/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Start all services (Ollama, backend, frontend)
        run: |
          docker compose up -d
          # Wait for Ollama to be ready (up to 30 seconds)
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready"
              break
            fi
            echo "Waiting for Ollama..."
            sleep 2
          done

      - name: Pull Ollama model (qwen2.5:0.5b)
        run: |
          curl -s -X POST http://localhost:11434/api/pull -d '{"model":"qwen2.5:0.5b"}' > /dev/null
          echo "Ollama model pull initiated"
          # Give it a moment to start pulling; actual pull may continue in background
          sleep 10

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8021/api/glossary > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Run backend tests
        working-directory: ./Maxwell
        run: |
          pytest tests/test_glossary.py -v

      - name: Lint Python files (optional)
        working-directory: ./Maxwell/backend
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run simple integration test (check frontend serves)
        run: |
          # Wait a bit more for frontend
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8020/)
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Frontend is serving correctly"
          else
            echo "Frontend returned HTTP $HTTP_CODE"
            exit 1
          fi
          # Check backend API again
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8021/api/glossary)
          if [ "$API_CODE" -eq 200 ]; then
            echo "Backend API is responding"
          else
            echo "Backend API returned HTTP $API_CODE"
            exit 1
          fi

      - name: Tear down containers
        if: always()
        run: |
          docker compose down