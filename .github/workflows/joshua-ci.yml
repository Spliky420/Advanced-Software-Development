# CI for Joshua's microservices (joshua/frontend, joshua/backend, joshua/database).
#
# Scope: this workflow builds and tests ONLY joshua/**. The path filters below
# keep it from running on another student's work, and nothing here reads or
# writes outside joshua/ and this file.
#
# No Ollama runs in CI, and none is needed: every LLM path in joshua/tests is
# either monkeypatched (llm.requests.post, llm.generate) or injected via
# drift.adapt's generate_fn. The whole suite has been verified to pass with all
# outbound sockets blocked.
#
# No MCP or RAG server runs in CI either: per the Release 1 brief both are
# host-run services, not part of this build. The backend job switches both
# clients off with empty MCP_SERVER_URL / RAG_SERVER_URL and prints and checks
# that config before the tests run. (joshua/tests/conftest.py also blanks them
# per test, so the suite never depends on the runner's environment.)

name: joshua-ci

on:
  push:
    branches:
      - Joshua-Portfolio-Holdings
      - Joshua-Release-0
    paths:
      - 'joshua/**'
      - '.github/workflows/joshua-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'joshua/**'
      - '.github/workflows/joshua-ci.yml'

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: joshua-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest, no Ollama)
    runs-on: ubuntu-24.04
    env:
      # Deliberately unreachable. Nothing in the suite should ever open a
      # socket to Ollama; if a future test regresses and tries, it fails fast
      # here instead of silently passing on a machine that happens to have one.
      OLLAMA_BASE_URL: http://127.0.0.1:1
      # Empty -- not unset -- is the clients' off switch. Unset would fall
      # back to their default host addresses.
      MCP_SERVER_URL: ''
      RAG_SERVER_URL: ''
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          # Matches python:3.11-slim in joshua/backend/Dockerfile, so CI tests
          # the interpreter the container actually ships.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            joshua/backend/requirements.txt
            joshua/tests/requirements.txt

      - name: Install backend and test dependencies
        # Both files are needed: the backend requirements provide Flask and
        # requests that the modules under test import, and the tests
        # requirements provide pytest itself.
        run: |
          python -m pip install --upgrade pip
          pip install -r joshua/backend/requirements.txt
          pip install -r joshua/tests/requirements.txt

      - name: Show AI service config (MCP and RAG disabled)
        # Prints the raw values, then asks the clients themselves how they
        # read them: both must report "disabled", or the step fails.
        working-directory: joshua/backend
        run: |
          echo "MCP_SERVER_URL='${MCP_SERVER_URL-<unset>}'"
          echo "RAG_SERVER_URL='${RAG_SERVER_URL-<unset>}'"
          echo "OLLAMA_BASE_URL='${OLLAMA_BASE_URL}'"
          python - <<'PY'
          import mcp_client, rag_client
          mcp_url, rag_url = mcp_client.get_server_url(), rag_client.get_server_url()
          print(f"mcp_client -> {'disabled' if mcp_url is None else mcp_url}")
          print(f"rag_client -> {'disabled' if rag_url is None else rag_url}")
          assert mcp_url is None, "MCP must be disabled in CI"
          assert rag_url is None, "RAG must be disabled in CI"
          PY

      - name: Run pytest
        run: pytest joshua/tests -v

  frontend:
    name: Frontend build (npm ci + vite build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: joshua/frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: joshua/frontend/package-lock.json

      - name: Install from the committed lockfile
        # `npm ci`, never `npm install`: it installs exactly what
        # package-lock.json pins and fails if the lockfile and package.json
        # have drifted apart, which is the property CI is here to protect.
        run: npm ci

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Build the frontend image
        # Same two-stage build compose uses; proves npm ci and vite build
        # succeed inside the image, not just on the runner.
        run: docker build -t joshua-frontend:ci joshua/frontend

      - name: Build the backend image
        run: docker build -t joshua-backend:ci joshua/backend

      - name: Build the database image
        # The third microservice. It owns portfolio.db and runs init.sql and
        # seed.sql on first start, so a break here breaks the whole stack.
        run: docker build -t joshua-database:ci joshua/database
