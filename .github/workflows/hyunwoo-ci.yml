# Builds and tests HyunWoo's three services.
name: hyunwoo-ci

on:
  # Lets cloud-deployment.yml run this workflow as a gate before deploying.
  workflow_call:
  push:
    branches:
      - HyunWoo-Bills-Subscriptions
    paths:
      - 'hyunwoo/**'
      - '.github/workflows/hyunwoo-ci.yml'
      - 'rag-server/corpus/HyunWoo_bills_knowledge.txt'
      - 'rag-server/corpus/HyunWoo_provider_*.txt'
  pull_request:
    branches:
      - main
    paths:
      - 'hyunwoo/**'
      - '.github/workflows/hyunwoo-ci.yml'
      - 'rag-server/corpus/HyunWoo_bills_knowledge.txt'
      - 'rag-server/corpus/HyunWoo_provider_*.txt'

permissions:
  contents: read

concurrency:
  group: hyunwoo-ci-${{ github.ref }}
  cancel-in-progress: true

# Local AI services are not started in CI.
env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"
  OLLAMA_BASE_URL: http://127.0.0.1:1
  MCP_SERVER_URL: http://127.0.0.1:1/mcp
  RAG_SERVER_URL: http://127.0.0.1:1
  MULTI_AGENT_URL: http://127.0.0.1:1

jobs:
  security-checks:
    name: Bills security checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install security tools
        run: python -m pip install -r hyunwoo/security/requirements.txt

      - name: Run Bills pre-commit security checks
        run: pre-commit run --config hyunwoo/.pre-commit-config.yaml --all-files --show-diff-on-failure

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            hyunwoo/backend/requirements.txt
            hyunwoo/tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hyunwoo/backend/requirements.txt
          pip install -r hyunwoo/tests/requirements.txt

      - name: Run tests
        run: pytest hyunwoo/tests -v

      - name: Record the two required endpoint checks
        run: >-
          pytest hyunwoo/tests/test_api.py -v
          -k 'test_health_and_seeded_records or test_create_read_update_and_delete_bill'
          --junitxml=hyunwoo-endpoint-tests.xml

      - name: Save endpoint test evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: hyunwoo-endpoint-tests
          path: hyunwoo-endpoint-tests.xml

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Check JavaScript
        run: node --check hyunwoo/frontend/app.js

  docker-images:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Build database image
        run: docker build -t hyunwoo-database:ci hyunwoo/database

      - name: Build backend image
        run: docker build -t hyunwoo-backend:ci hyunwoo/backend

      - name: Build frontend image
        run: docker build -t hyunwoo-frontend:ci hyunwoo/frontend
