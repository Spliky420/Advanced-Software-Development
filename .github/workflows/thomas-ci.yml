
name: Thomas Transactions CI

on:
  # Lets cloud-deployment.yml run this workflow as a gate before deploying.
  workflow_call:
  push:
    paths:
      - "Thomas/**"
      - ".github/workflows/thomas-ci.yml"

  pull_request:
    paths:
      - "Thomas/**"
      - ".github/workflows/thomas-ci.yml"

jobs:
  validate-thomas-services:
    runs-on: ubuntu-latest

    env:
      MCP_SERVER_URL: ""
      RAG_SERVER_URL: ""
      MULTI_AGENT_URL: "http://localhost:5004"
      PYTHONPATH: "Thomas/backend"
      DATABASE_PATH: "/tmp/thomas-ci-transactions.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: Thomas/backend
        run: |
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install pytest

      - name: Check backend Python syntax
        working-directory: Thomas/backend
        run: |
          python -m py_compile app.py

      - name: Test two Transactions API endpoints
        run: |
          python -m pytest -v Thomas/tests/test_transactions_api.py

      - name: Install frontend dependencies
        working-directory: Thomas/frontend
        run: |
          python -m pip install -r requirements.txt

      - name: Check frontend Python syntax
        working-directory: Thomas/frontend
        run: |
          python -m py_compile app.py

      - name: Confirm MCP and RAG are disabled in CI
        run: |
          test -z "$MCP_SERVER_URL"
          test -z "$RAG_SERVER_URL"
          echo "Local MCP and RAG services are disabled in CI"

      - name: Build backend Docker image
        run: |
          docker build -t thomas-backend ./Thomas/backend

      - name: Build frontend Docker image
        run: |
          docker build -t thomas-frontend ./Thomas/frontend
