# CI for Enerel's microservices (Enerel/frontend, Enerel/backend, Enerel/database).
#
# Scope: this workflow builds and tests ONLY Enerel/**. The path filters below
# keep it from running on another student's work, and nothing here reads or
# writes outside Enerel/ and this file.
#
# No Ollama runs in CI, and none is needed: every LLM path in Enerel/tests is
# either monkeypatched (llm.requests.post, llm.generate, llm.embed) or
# injected via summarize.adapt's / retrieval.act's generate_fn/embed_fn. The
# whole suite has been verified to pass with all outbound sockets blocked.
#
# Release 1: the MCP and RAG integration code ships and is tested here, but
# both modes are DISABLED for the run (MCP_ENABLED / RAG_ENABLED = false) --
# the shared MCP and RAG servers run on a developer's host, never in CI. The
# tests stub the MCP/RAG network legs, and a final step proves the running
# app reports both modes off and refuses MCP/RAG requests with a 503.

name: enerel-ci

on:
  push:
    branches:
      - Enerel-Research-Library
      - enerel-release1
    paths:
      - 'Enerel/**'
      - '.github/workflows/enerel-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Enerel/**'
      - '.github/workflows/enerel-ci.yml'

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: enerel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest, no Ollama)
    runs-on: ubuntu-24.04
    env:
      # Deliberately unreachable. Nothing in the suite should ever open a
      # socket to Ollama; if a future test regresses and tries, it fails fast
      # here instead of silently passing on a machine that happens to have one.
      OLLAMA_BASE_URL: http://127.0.0.1:1
      # MCP and RAG disabled for CI/CD, with unreachable URLs as a second
      # line of defence -- same reasoning as OLLAMA_BASE_URL above.
      MCP_ENABLED: "false"
      MCP_SERVER_URL: http://127.0.0.1:1/mcp
      RAG_ENABLED: "false"
      RAG_SERVER_URL: http://127.0.0.1:1
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          # Matches python:3.11-slim in Enerel/backend/Dockerfile, so CI tests
          # the interpreter the container actually ships.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            Enerel/backend/requirements.txt
            Enerel/tests/requirements.txt

      - name: Install backend and test dependencies
        # Both files are needed: the backend requirements provide Flask and
        # requests that the modules under test import, and the tests
        # requirements provide pytest itself.
        run: |
          python -m pip install --upgrade pip
          pip install -r Enerel/backend/requirements.txt
          pip install -r Enerel/tests/requirements.txt

      - name: Run pytest
        run: pytest Enerel/tests -v

      - name: Confirm MCP and RAG modes are disabled
        # Exercises the real app (Flask test client against a schema-only
        # database) with the job's env: the integrations endpoint must report
        # both modes off, and both MCP and RAG endpoints must refuse with 503
        # without opening a connection.
        working-directory: Enerel/backend
        run: |
          python - <<'PY'
          import json, os, sqlite3, tempfile
          import db
          path = os.path.join(tempfile.mkdtemp(), "library.db")
          conn = sqlite3.connect(path)
          conn.executescript(open("../database/init.sql").read())
          conn.execute(
              "INSERT INTO documents (user_id, title, doc_type, body_text, created_at, updated_at) "
              "VALUES (1, 'CI', 'other', 'ETF volatility', 'now', 'now')"
          )
          conn.commit(); conn.close()
          db.DB_PATH = path
          from app import create_app
          client = create_app().test_client()

          status = client.get("/api/library/integrations").get_json()
          print(json.dumps(status, indent=2))
          assert status["mcp"]["enabled"] is False, "MCP must be disabled in CI"
          assert status["rag"]["enabled"] is False, "RAG must be disabled in CI"

          mcp = client.post("/api/documents/1/glossary", json={"term": "ETF"})
          rag = client.post("/api/library/ask", json={"question": "what is an ETF"})
          print("MCP glossary lookup ->", mcp.status_code, mcp.get_json())
          print("RAG ask             ->", rag.status_code, rag.get_json())
          assert mcp.status_code == 503 and mcp.get_json()["mcp_enabled"] is False
          assert rag.status_code == 503 and rag.get_json()["rag_enabled"] is False
          print("MCP and RAG integration present and disabled for CI/CD.")
          PY

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Build the database image
        run: docker build -t enerel-database:ci Enerel/database

      - name: Build the backend image
        run: docker build -t enerel-backend:ci Enerel/backend

      - name: Build the frontend image
        run: docker build -t enerel-frontend:ci Enerel/frontend
