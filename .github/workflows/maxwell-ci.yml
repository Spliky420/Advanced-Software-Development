name: maxwell-ci

on:
  push:
    paths:
      - "Maxwell/**"
      - ".github/workflows/maxwell-ci.yml"
    branches: [ main, '**' ]

  pull_request:
    paths:
      - "Maxwell/**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OLLAMA_BASE_URL: http://127.0.0.1:1
      DISABLE_AI_MODE: true
      DISABLE_MCP_PROXY: true
      DISABLE_RAG_PROXY: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama
          key: ${{ runner.os }}-ollama-${{ hashFiles('docker-compose.yml') }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-ollama-

      - name: Install backend dependencies
        working-directory: ./Maxwell/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build Docker images
        run: |
          docker compose build maxwell-database maxwell-backend maxwell-frontend

      - name: Start all services (Ollama, backend, frontend)
        run: |
          docker compose up -d


      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8021/api/glossary > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Run backend tests
        working-directory: ./Maxwell
        run: |
          pytest tests/test_glossary.py -v

      - name: Lint Python files (optional)
        working-directory: ./Maxwell/backend
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run simple integration test (check frontend serves)
        run: |
          # Wait a bit more for frontend
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8020/)
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Frontend is serving correctly"
          else
            echo "Frontend returned HTTP $HTTP_CODE"
            exit 1
          fi
          # Check backend API again
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8021/api/glossary)
          if [ "$API_CODE" -eq 200 ]; then
            echo "Backend API is responding"
          else
            echo "Backend API returned HTTP $API_CODE"
            exit 1
          fi

      - name: Tear down containers
        if: always()
        run: |
          docker compose down