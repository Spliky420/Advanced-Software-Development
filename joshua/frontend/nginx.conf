server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: the React router owns /holdings/3, /allocation and
    # the rest, and nginx has no file at those paths. Falling back to
    # index.html is what stops a refresh or a pasted deep link 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets, so a given URL's contents
    # never change and the file can be cached indefinitely. index.html must
    # not be, or a rebuild would keep serving the old asset references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy the API through the same origin so the page needs no CORS headers
    # on the Flask side. joshua-backend resolves on the compose network.
    location /api/ {
        proxy_pass http://joshua-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Generous, to allow for slow local LLM generation on /api/insights
        # and /api/drift-review -- both can take tens of seconds.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://joshua-backend:5000/health;
        proxy_set_header Host $host;
    }
}
