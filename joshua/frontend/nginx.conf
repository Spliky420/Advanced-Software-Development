server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API through the same origin so the page needs no CORS headers
    # on the Flask side. joshua-backend resolves on the compose network.
    location /api/ {
        proxy_pass http://joshua-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Generous, to allow for slow LLM generation on /api/insights.
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://joshua-backend:5000/health;
        proxy_set_header Host $host;
    }
}
