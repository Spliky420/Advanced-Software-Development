server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: React Router owns /goals/3 and /goals/3/edit, and
    # nginx has no file at those paths. Falling back to index.html is what
    # stops a refresh or a pasted deep link 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets, so a given URL's contents
    # never change and it can be cached indefinitely. index.html must not be,
    # or a rebuild would keep serving the old asset references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy the API through this same origin, so the browser makes no
    # cross-origin request and the Flask CORS layer never has to fire.
    # lehoalong-backend resolves on the compose network.
    location /api/ {
        proxy_pass http://lehoalong-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Generous read timeout: POST /plan and POST /replan run a local model
        # and can take tens of seconds. The default 60s would cut off a slow
        # generation and show the user a 504 for a request that was working.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://lehoalong-backend:5000/health;
        proxy_set_header Host $host;
    }
}
